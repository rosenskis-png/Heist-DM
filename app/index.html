<title>Heist-DM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Spectral:ital,wght@0,200;0,300;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column on a phone (sticky clock, three tabs, the card as a sheet); on a wide screen the map and clock
   hold a left column and the tabs the right. Gravenhold's plum, gold and rose (docs/spec/ui.md). */
:root {
  --bg: #ece5ea; --surface: #f7f2f5; --surface2: #e2d8df; --ink: #2a1d2c; --muted: #6e5d6c; --line: #cdbfc9;
  --gold: #9a6b14; --rose: #a83a62; --trust: #2f7d74; --danger: #b3261e;
  --ok-bg: #dcebe6; --bad-bg: #f3dcdc; --gold-bg: #f1e5cc;
  --floor-bright: #f3ead8; --floor-dim: #ddd0d8; --floor-dark: #b9a9b6; --wall: #2a1d2c;
  --display: "Spectral", Georgia, serif;
  --body: "Alegreya Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1420; --surface: #251c2b; --surface2: #30253a; --ink: #ecdfcf; --muted: #a8978f; --line: #43354b;
  --gold: #d8a94e; --rose: #d0658f; --trust: #6fb3a8; --danger: #ff8a80;
  --ok-bg: #1e3530; --bad-bg: #3d2224; --gold-bg: #3a2e18;
  --floor-bright: #4a3d33; --floor-dim: #352a3b; --floor-dark: #221a28; --wall: #d9c9b6; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1b1420; --surface: #251c2b; --surface2: #30253a; --ink: #ecdfcf; --muted: #a8978f; --line: #43354b;
  --gold: #d8a94e; --rose: #d0658f; --trust: #6fb3a8; --danger: #ff8a80;
  --ok-bg: #1e3530; --bad-bg: #3d2224; --gold-bg: #3a2e18;
  --floor-bright: #4a3d33; --floor-dim: #352a3b; --floor-dark: #221a28; --wall: #d9c9b6; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
#root { min-height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.primary { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 700; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 4px 6px; }
.link.danger { color: var(--danger); }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* Title and setup */
.title { max-width: 640px; margin: 0 auto; padding-block: 12vh 48px; display: grid; gap: 14px; }
.wordmark { font-family: var(--display); font-weight: 200; font-size: clamp(52px, 15vw, 96px); letter-spacing: -.04em; line-height: .9; margin: 0;
  background: linear-gradient(180deg, var(--ink) 30%, var(--gold) 140%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tagline { font-family: var(--display); font-style: italic; font-size: 19px; color: var(--muted); max-width: 30em; margin: 0 0 28px; }
.slots { display: grid; gap: 10px; }
.slot { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 8px 4px 4px; }
.slot.empty { border-style: dashed; background: none; }
.slotmain { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 10px 12px; display: grid; }
.slotname { font-weight: 700; font-size: 17px; }
.slotmeta { color: var(--muted); font-size: 14px; }
.setup { max-width: 620px; margin: 0 auto; padding-block: 8vh 60px; display: grid; gap: 18px; }
.setup h2 { font-family: var(--display); font-weight: 300; font-size: 34px; margin: 0; }
.field { display: grid; gap: 6px; max-width: 340px; }
.field span { color: var(--muted); font-size: 14px; }
.party { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.who { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--cc, var(--gold)); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; font-size: 14.5px; color: var(--muted); }
.who strong { color: var(--ink); font-size: 16px; }

/* The game */
.game { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 10px; padding-block: 8px; max-width: 1240px; margin: 0 auto; }
.where { font-family: var(--display); font-size: 19px; font-weight: 500; white-space: nowrap; }
.clock { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.clock b { color: var(--ink); font-weight: 700; }
.clock .soon { color: var(--danger); }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: 10px; min-width: 40px; height: 40px; padding: 0 10px; }
.hp { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.hp span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.hp .down { color: var(--danger); border-color: var(--danger); }
.tabs { display: flex; gap: 4px; padding-bottom: 8px; max-width: 1240px; margin: 0 auto; }
.tabs button { position: relative; border: 0; background: none; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tabs .dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--rose); }
.tabs .maptab { margin-left: auto; }
.menu { max-width: 1240px; margin: 0 auto 8px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 10px; font-size: 15px; }
.menu .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.speed { display: flex; gap: 6px; flex-wrap: wrap; }
.speed button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; }
.speed button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.body { display: grid; gap: 16px; max-width: 1240px; width: 100%; margin: 0 auto; padding-block: 14px 40px; align-items: start; }
.side { display: grid; gap: 10px; min-width: 0; }
.pane { display: grid; gap: 12px; min-width: 0; }
@media (min-width: 920px) {
  .body { grid-template-columns: minmax(340px, 5fr) 7fr; }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); }
  .tabs .maptab { display: none; }
}
@media (max-width: 919px) { .side.closed { display: none; } }

/* Feeds */
.feed { display: grid; gap: 12px; }
.say { display: grid; gap: 2px; max-width: 68ch; }
.say .from { font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.say.player { justify-self: end; text-align: right; }
.say.player .text { background: var(--surface2); border-radius: 14px 14px 4px 14px; padding: 8px 12px; }
.say.comp .from { color: var(--cc, var(--rose)); }
.say.comp .text { border-left: 3px solid var(--cc, var(--rose)); padding-left: 10px; }
.say.pass .text { font-style: italic; color: var(--muted); }
.narr { font-family: var(--display); font-size: 18px; line-height: 1.6; max-width: 66ch; }
.narr p { margin: 0 0 10px; }
.system { font-size: 14px; color: var(--danger); }
.check { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: grid; gap: 4px; background: var(--surface); max-width: 68ch; }
.pill { display: inline-block; font: 500 12px/1.3 var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--ink); }
.pill.ok { background: var(--ok-bg); color: var(--trust); }
.pill.bad { background: var(--bad-bg); color: var(--danger); }
.pill.gold { background: var(--gold-bg); color: var(--gold); }
.stance { margin-top: 4px; font-size: 14px; color: var(--muted); }
.redirect { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 1px dashed var(--line); border-radius: 12px; padding: 8px 12px; max-width: 68ch; }
.redirect q { flex: 1; min-width: 12em; }
.composer { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.composer .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.to { display: flex; gap: 6px; flex-wrap: wrap; }
.to button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.to button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.status { font-size: 14px; color: var(--muted); font-style: italic; }
.error { font-size: 14px; color: var(--danger); background: var(--bad-bg); border-radius: 10px; padding: 8px 12px; }
.stances { display: grid; gap: 8px; }
.stancebox { display: grid; gap: 6px; border-left: 3px solid var(--cc, var(--rose)); padding: 4px 0 4px 10px; }
.choices { display: flex; gap: 6px; flex-wrap: wrap; }
.choices button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 12px; font-size: 14px; }
.choices button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: var(--gold-bg); }

/* The card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
.card h3 { font-family: var(--display); font-weight: 500; font-size: 22px; margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 2em 1fr; gap: 4px 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.step .n { font: 500 14px var(--mono); color: var(--muted); padding-top: 2px; }
.step .main { display: grid; gap: 5px; min-width: 0; }
.timing { display: flex; flex-wrap: wrap; gap: 6px; }
.risk { font-size: 14.5px; display: grid; gap: 2px; }
.risk .fails { color: var(--muted); }
.covered { font-size: 14px; color: var(--trust); }
.pause { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.cardfoot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--ink) 35%, transparent); display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 88%; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 920px) { .sheet-wrap { position: static; background: none; display: block; } .sheet { max-height: none; overflow: visible; border-radius: 0; background: none; padding: 0; } }

/* Map and clock panel */
.mapbox { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: grid; gap: 8px; }
.mapbox svg { width: 100%; height: auto; display: block; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lvl { display: grid; gap: 2px; }
.lvl .cap { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.zone-label { font: 500 9px var(--body); fill: var(--muted); }
.thing-label { font: 8px var(--body); fill: var(--muted); }
.token-label { font: 700 10px var(--body); }
.beatbox { font-size: 14px; display: grid; gap: 4px; }
.beatbox .cue { color: var(--muted); font-style: italic; }

/* Ending, developer view */
.ending { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; padding-block: 24px; }
.ending h2 { font-family: var(--display); font-weight: 300; font-size: 32px; margin: 0; }
.dev { display: grid; gap: 8px; font-size: 14px; }
.dev details { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--surface); }
.dev summary { cursor: pointer; display: flex; gap: 8px; flex-wrap: wrap; }
.dev pre { font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 50vh; overflow: auto; margin: 6px 0 0; }
.counts { display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="root"><p class="gutter muted" style="padding-top:24px">Loading the Cells…</p></div>
