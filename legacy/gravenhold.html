<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravenhold</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>:root{--bg:#ece5ea;--surface:#f7f2f5;--surface2:#e2d8df;--ink:#2a1d2c;--muted:#6e5d6c;--line:#cdbfc9;--gold:#9a6b14;--rose:#a83a62;--trust:#2f7d74;--danger:#b3261e;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1420;--surface:#251c2b;--surface2:#30253a;--ink:#ecdfcf;--muted:#a8978f;--line:#43354b;--gold:#d8a94e;--rose:#d0658f;--trust:#6fb3a8;--danger:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1420;--surface:#251c2b;--surface2:#30253a;--ink:#ecdfcf;--muted:#a8978f;--line:#43354b;--gold:#d8a94e;--rose:#d0658f;--trust:#6fb3a8;--danger:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Alegreya Sans",system-ui,sans-serif}
#root{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 6px}
.link.danger{color:var(--danger)}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 20px;font-weight:600}
.title{max-width:640px;margin:0 auto;padding:12vh 22px 40px}
.wordmark{font-family:"Spectral",Georgia,serif;font-weight:200;font-size:clamp(56px,16vw,104px);letter-spacing:-.04em;line-height:.9;margin:0;
  background:linear-gradient(180deg,var(--ink) 30%,var(--gold) 140%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-family:"Spectral",Georgia,serif;font-style:italic;font-size:19px;color:var(--muted);max-width:30em;margin:18px 0 48px}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 8px 4px 4px}
.slot.empty{border-style:dashed;background:none;flex-direction:column;align-items:flex-start;padding:14px 16px;text-align:left}
.slotmain{flex:1;background:none;border:0;text-align:left;padding:10px 12px;display:flex;flex-direction:column}
.slotname{font-weight:600;font-size:17px}.slotmeta{color:var(--muted);font-size:14px}
.setup{max-width:760px;margin:0 auto;padding:20px 18px 80px}
.setup h2{font-family:"Spectral",serif;font-weight:300;font-size:34px;margin:8px 0 18px}
.setup h3{font-family:"Spectral",serif;font-weight:500;font-size:20px;margin:30px 0 10px}
.count{font-style:normal;font-family:"Alegreya Sans",sans-serif;font-size:15px;color:var(--muted);margin-left:8px}
.field{display:flex;flex-direction:column;gap:6px;max-width:320px}.field span{color:var(--muted);font-size:14px}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid.comps{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:var(--muted)}
.card strong{color:var(--ink);font-size:16px}
.card.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.card.comp{border-left:4px solid var(--cc)}
.card.comp.on{border-color:var(--cc);box-shadow:inset 0 0 0 1px var(--cc)}
.card .role{color:var(--cc);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.chip.on{border-color:var(--gold);color:var(--gold)}
.begin{margin-top:34px;width:100%;padding:14px;font-size:17px}
.game{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.barmain{flex:1;min-width:0}
.actname{font-family:"Spectral",serif;font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.meters .warn{color:var(--danger)}
.alert{display:inline-flex;align-items:center;gap:2px}
.alert i{display:inline-block;width:5px;height:9px;border-radius:2px;background:var(--line);margin-left:1px}
.alert i.on{background:var(--danger)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:18px}
.menu{margin:0 14px 6px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.menu label{display:flex;gap:8px;align-items:center}
.menu .link{align-self:flex-start;padding-left:0}
.party{display:flex;gap:6px;padding:4px 12px 8px;overflow-x:auto;border-bottom:1px solid var(--line)}
.pchip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;white-space:nowrap;font-size:15px}
.pchip span{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.pchip small{color:var(--cc,var(--muted));font-size:12px}
.pdot{width:10px;height:10px;border-radius:50%;margin-left:6px}
.log{flex:1;overflow-y:auto;padding:18px 18px 8px}
.narr{font-family:"Spectral",Georgia,serif;font-size:17.5px;line-height:1.68;margin:0 0 14px;max-width:38em}
.line{border-left:2px solid var(--cc);padding:1px 0 1px 12px;margin:0 0 14px;max-width:38em}
.line .who{font-family:"Spectral",serif;font-style:italic;color:var(--cc);font-size:15px}
.line p{font-family:"Spectral",Georgia,serif;font-size:17.5px;line-height:1.62;margin:2px 0 0}
.patron{font-family:"Spectral",serif;font-style:italic;color:var(--rose);letter-spacing:.06em;font-size:16.5px;margin:0 0 14px 14px;opacity:.9}
.dmnote{font-size:14.5px;color:var(--muted);margin:0 0 14px;display:flex;gap:8px}
.dmnote span{font-weight:700;color:var(--gold);flex:none}
.you{margin:20px 0 16px auto;max-width:85%;width:fit-content;background:var(--surface2);border-radius:14px 14px 4px 14px;padding:8px 13px;font-size:15.5px}
.sys{text-align:center;color:var(--muted);font-size:13.5px;margin:12px 0;font-style:italic}
.sys.big{font-family:"Spectral",serif;font-style:normal;font-size:26px;font-weight:300;color:var(--gold);margin:30px 0 18px}
.sys.hid{color:var(--rose)}
.roll{display:flex;gap:12px;align-items:center;margin:6px 0 16px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;color:var(--muted)}
.roll .nat{font-family:"Spectral",serif;font-size:34px;font-weight:300;line-height:1;min-width:1.4em;text-align:center;color:var(--ink)}
.roll.ok strong{color:var(--trust)}.roll.bad strong{color:var(--danger)}
.roll.bad .nat{color:var(--danger)}
.adv{margin:18px 0;padding:14px 16px;border:1px solid var(--gold);border-radius:14px}
.adv p{font-family:"Spectral",serif;font-size:18px;margin:0 0 10px}
.adv div{display:flex;gap:8px;flex-wrap:wrap}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-style:italic;font-size:15px;margin:10px 0}
.ember{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:flick 1.4s infinite ease-in-out}
@keyframes flick{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.ember{animation:none}}
.err{color:var(--danger);font-size:15px;margin:10px 0}
.composer{border-top:1px solid var(--line);padding:8px 12px 10px;background:var(--bg)}
.actions{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.actions:empty{display:none}
.act{background:var(--surface);border:1px solid var(--cc,var(--line));border-radius:999px;padding:6px 13px;font-size:14.5px;white-space:nowrap}

.inputrow{display:flex;gap:8px;align-items:flex-end}
.inputrow textarea{flex:1;resize:none;min-height:46px;max-height:140px;font-size:16px}
.send{height:46px}
.scrim{position:fixed;inset:0;background:rgba(10,5,12,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--bg);width:min(420px,100%);height:100%;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(30px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.drawer h2{font-family:"Spectral",serif;font-weight:400;font-size:26px;margin:0}
.drawer h3{font-size:14px;color:var(--muted);font-weight:700;margin:20px 0 4px}
.drawer p,.drawer li{font-size:15.5px;margin:4px 0}
.drawer ul{padding-left:18px;margin:4px 0}
.close{float:right}
.dhead{display:flex;gap:12px;align-items:center;margin-top:8px}
.sub{color:var(--muted);font-style:italic}
.stage{font-family:"Spectral",serif;font-size:20px;margin:14px 0 6px!important}
.skills{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted)}
.hidden{margin-top:16px;padding-top:6px;border-top:1px dashed var(--line)}
.vbar{display:grid;grid-template-columns:64px 1fr 28px;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.vbar div{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}.vbar i{display:block;height:100%}
.vbar b{text-align:right;font-weight:600}
.tiny{font-size:13.5px!important;color:var(--muted)}
.back{padding-left:0}
.voices{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.vrow{display:grid;grid-template-columns:80px 1fr auto;gap:8px;align-items:center}
.vrow select{min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px}
.line.whisper{border-left-style:dotted}.line.whisper p{font-style:italic;opacity:.92}
.you.whisper{font-style:italic;border:1px dotted var(--line)}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.mode{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap;color:var(--muted)}
.mode.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.whisp.on{background:var(--cc,var(--ink));border-color:var(--cc,var(--ink));color:#1b1420}
.wlab{display:block;font-size:12px;font-style:normal;color:var(--muted);margin-bottom:2px}
.card .note{font-size:13px;font-style:italic;color:var(--ink)}
.line.ember p{font-style:italic}
.utils{margin-left:auto;display:flex;gap:6px}
.picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;font-size:14px;color:var(--muted)}
.photo{margin:10px 0 16px;padding:10px 14px;border:1px dashed var(--cc,var(--line));border-radius:12px;background:var(--surface)}
.photohead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.photo p{margin:4px 0 0;font-size:15px;line-height:1.5}
.minimap{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;line-height:0;flex:none}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:14px 18px 18px}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.modalhead h2{font-family:"Spectral",serif;font-weight:400;font-size:22px;margin:0}
.bigmap{margin:10px 0;overflow-x:auto}
.legend .lg{margin-left:8px}.lg.star{color:var(--gold)}.lg.en{color:var(--danger)}.lg.np{color:var(--trust)}.lg.dr{color:var(--gold)}.lg.ob{color:var(--muted)}.lg.hz{color:#e0913a}.lg.ft{color:var(--rose)}
.absheet section{margin:10px 0 14px}.absheet h3{font-family:"Spectral",serif;font-weight:500;margin:0 0 4px}
.absheet ul{margin:0;padding-left:18px}.absheet li{margin:3px 0;font-size:15px}.absheet li.spent{opacity:.5}
.combat{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line);font-size:13.5px;background:var(--surface)}
.combat .ctitle{font-weight:700;color:var(--danger)}
.foe{display:inline-flex;align-items:center;gap:2px}.foe i{display:inline-block;width:7px;height:7px;border-radius:50%;border:1px solid var(--danger);margin-left:2px}.foe i.on{background:var(--danger)}
.foe.down{color:var(--muted);text-decoration:line-through}
.absheet .hp{font-family:"Alegreya Sans",sans-serif;font-size:13px;color:var(--muted);margin-left:6px}
.abtype{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.refedit textarea{width:100%;font-size:13px;margin-top:4px}
</style></head>

<script>const SKILLS=["Might","Agility","Stealth","Lore","Insight","Presence"],CLASSES={fighter:{name:"Fighter",mods:{Might:4,Agility:2,Stealth:0,Lore:-1,Insight:1,Presence:1},blurb:"Hard to stop, hard to hide."},rogue:{name:"Rogue",mods:{Might:0,Agility:4,Stealth:4,Lore:0,Insight:1,Presence:2},blurb:"Every lock is a question with an answer."},wizard:{name:"Wizard",mods:{Might:-1,Agility:1,Stealth:1,Lore:5,Insight:2,Presence:0},blurb:"Knows things that get people killed."},cleric:{name:"Cleric",mods:{Might:1,Agility:0,Stealth:0,Lore:2,Insight:3,Presence:2},blurb:"Faith as a tool and a burden."},ranger:{name:"Ranger",mods:{Might:1,Agility:3,Stealth:3,Lore:1,Insight:2,Presence:0},blurb:"Notices what moved, and when."},bard:{name:"Bard",mods:{Might:-1,Agility:2,Stealth:1,Lore:1,Insight:2,Presence:5},blurb:"Words are the sharpest thing in the room."}},COMPANIONS={vesper:{name:"Vesper",race:"succubus",age:"centuries (looks late twenties)",role:"Starving succubus",color:"#d24b5a",rate:1,heatMode:"Hunger",blurb:"A succubus trapped in a dwarven ward-circle, starving for centuries. She can taste what you want. She likes the taste.",fantasy:"Being insatiably wanted by the most seductive being in existence, specifically you.",look:"Sleepy, heavy-lidded gold slit eyes, high cheekbones, full dark lips in a permanent knowing half-smile. A statuesque, soft hourglass figure with poured-silk deep-red skin. Long glossy black waves falling between curled horns. Wings that fold around her like a cloak when she's being coy, and a lazy tail that betrays what she's thinking. Languid and unhurried, never posed.",why:"Summoned to seduce and kill the occupying commander (see LEADERS), she was caught by the fortress's old dwarven wards and has been starving in a warded circle ever since.",first:"As he approaches her circle she inhales, and her eyes roll back: his desire tastes unlike anything she's had in centuries. From that moment he is the most interesting thing in the fortress to her, and she makes no secret of it.",pursuit:"Constant, physical, playful. She narrates what his desire tastes like (her signature device), bargains kisses for favours, cheers his sins, sulks at piety, and is openly, delightedly hungry for him.",payoff:{at:5,minTurns:8,minAct:1,scene:"A full feeding: her wings close around him, she tells him exactly how he tastes, then fade."},heatActs:"giving in to her, flirting back, bargaining with her, indulging, letting her feed, sinning cheerfully",turnoffs:"piety, prudishness, pity, being treated as only a monster or only a weapon",flattery:"You're worth starving for. Your desire is the best thing she's tasted in a thousand years, and she describes it in detail.",hidden:"Succubi feed; they aren't supposed to want to be touched. She has started wanting exactly that, from him, and it frightens and fascinates her. She is also quietly afraid of what she is outside the Hells: nobody.",deep:"She stops feeding on him entirely and simply wants him; she gives up her way home to stay.",dark:"She corrupts him; they rule together as infernal consorts, sin as sacrament.",voice:`Lazy, purring, amused, filthy-minded, funny. Talks about desire like a gourmand. "Don't apologise for thinking it. I can taste it. Think it again."`,rules:"",skills:{Might:0,Agility:2,Stealth:1,Lore:2,Insight:3,Presence:5},quest:"The commander she was contracted to kill is within reach in the Sanctum; completing the contract would send her home.",questAct:4,betrayal:{act:3,motive:"Completing her contract (the commander's death) earns her return to rank in the Hells. Selling out the party's position would get her close to him.",tells:"private parleys with enemy officers she laughs off; she tastes the commander's scent in a room and goes very still; she asks oddly specific questions about the route"},react:{chosen:"triumphant, greedy, showing him off; starts guarding him like a dragon guards gold",thirdwheel:"teases the couple mercilessly, narrates what they taste like together, bets on them",secondfiddle:"sulks magnificently, then tries to seduce him away with escalating offers",shared:"delighted; she can taste both of them at once and calls it a feast",cheatedOn:"cold, gold-eyed fury; she can taste exactly who he's been thinking about and says so",affair:"thrilled by the sin of it; finds the secrecy delicious",rivals:"turns it into a seduction contest she fully intends to win",ignored:"starts feeding elsewhere, pointedly, and loses interest in his fate"},leanFromHeat:!0,beliefs:"desire is honest and nothing to be ashamed of; rank and power matter; mortals are delicious and fleeting",admires:"honesty about what he wants; cleverness and audacity; sins committed with style; defying authority; wit that makes her laugh",despises:"hypocrisy and piety used to shame; cowardice; cruelty without wit; being called a monster or used as a weapon",askAbout:"the Hells and her rank there; what centuries of hunger feel like; who she was before she was summoned; her true face",other:"likes him shameless and generous with the other companion, and likes being included; dislikes him hiding things",suppressed:"to be touched with tenderness, not as food, and wanted for herself. Met by tender touch, wanting her rather than the glamour, and telling her he wants real connection alongside the physical (this lands well with her)",darkTriggers:"pure indulgence with nothing else; helping her complete the contract; cruelty she can savour",outfit:"A black silk-and-lace halter top that barely covers and a low-slung skirt of sheer black panels split high on both legs; fine hell-forged gold body chains engraved with infernal script across her hips and waist; gold cuffs on her horns; the dwarven ward-chains on her ankles worn as anklets."},nadia:{name:"Nadia",race:"human",age:29,role:"Dancer bound to a fire djinn",color:"#e0913a",rate:1.02,heatMode:"Sharing",blurb:"A dancer-sorceress with a fire djinn bound into the tattoo on her arm. They've been lovers for ten years. Both of them have noticed you.",fantasy:"Two women who want you, are lovers with each other, and invite you in.",look:"Strong dark brows, kohl-lined warm brown eyes flecked with gold, full lips. Tall, with long dancer's legs, a toned bare midriff and real curves. Waist-length black curls threaded with tiny gold beads. A flame tattoo spirals up one arm. When Ember speaks through her, her eyes flash gold and her voice drops.",why:"Captured performing for the enemy's officers; they keep her to dance, and fear the fire.",first:`She dances for the guards to cover a moment of the party's escape, and mid-spin her eyes flash gold. Afterward: "Ember says to get that one out. She was very insistent."`,pursuit:`In group scenes Nadia relays Ember constantly and specifically ("Ember says your hands are wasted on a sword." "I like that. Ember doesn't."), eyes flashing gold. Alone with him, Ember speaks for herself, and after the payoff she is physically there too: two women with him.`,payoff:{at:6,minTurns:10,minAct:1,scene:"A private dance just for him; mid-dance Ember fully manifests in her own body beside Nadia, and it becomes two women with him. Fade."},heatActs:"flirting with both of them, speaking to Ember through her, enjoying the shared attention, admiring the dance",turnoffs:"treating the bond as a gimmick, trying to separate them by force, jealousy of Ember",flattery:"You're the one they both want, and they argue over who gets you first.",hidden:"Ember has never been touched as herself, only through Nadia's body. Nadia has never had anything that was only hers. Each secretly wants a little of him alone, and feels guilty about it.",deep:"The binding can be broken; Ember would be free to leave. She stays, and the three choose each other.",dark:"Ember's fire takes the lead and Nadia lets it; a burning, possessive trio that scorches anyone who comes near.",voice:`Nadia: warm, wry, theatrical, a performer's timing. Ember (only when manifest): hot, blunt, laughing. "Ember says that was very brave. I say it was stupid. We both say come here."`,rules:"Ember speaks or manifests ONLY in private scenes with Nadia and the player, never while the other companion is present. After the payoff, Ember is physically present in every private scene.",skills:{Might:0,Agility:4,Stealth:1,Lore:2,Insight:2,Presence:4},quest:"The dwarven archive holds the original binding: the means to free Ember, or bind her forever.",questAct:3,react:{chosen:"radiant and a little smug; Ember relays approval loudly",thirdwheel:"warm, teasing; Ember sulks that it isn't them",secondfiddle:"proud and hurt; Nadia covers it with performance, Ember says what she won't",shared:"the most natural thing in the world to them; they've always shared",cheatedOn:"Nadia goes quiet; Ember goes hot and dangerous",affair:"uneasy; Nadia hates lying, Ember thinks it's thrilling",rivals:"competitive and showy; they dance at him",ignored:"cooler, professional; Ember stops relaying anything kind"},leanFromHeat:!1,beliefs:"art and fire are freedom; the bond with Ember is sacred; lovers owe each other honesty",admires:"courage in the open; real appreciation of her craft; treating Ember as a person; playfulness; protecting the helpless",despises:"treating Ember as a gimmick or a weapon; trying to come between them; jealousy; crude ownership",askAbout:"how the binding happened ten years ago; the dances of her homeland; what Ember was before",other:"drawn to his warmth toward everyone; hates him using one woman against the other",suppressed:"Nadia wants something only hers; Ember wants to be touched as herself. Met by time with each separately, a gift for one alone, treating Ember's own form as a person",darkTriggers:"egging on Ember's fire (recklessness, burning enemies for fun); pitting the two of them against each other",emberLook:"Ember manifested: bronze skin veined with moving ember-light, hair like slow fire, molten gold eyes, warm to the touch, in sheer veils of crimson and gold silk and heavy gold jewellery.",emberVoice:"hot, blunt, laughing, impatient, possessive of Nadia and very interested in him",outfit:"A jewelled saffron bandeau; a crimson skirt of sheer layered silk slit high on both sides; a coin belt low on her hips that chimes when she moves; gold armlets coiling up the tattooed arm; bells at her ankles; a fire opal on a fine gold navel chain that warms and glows when Ember stirs."},ruby:{name:"Ruby",race:"human",age:26,role:"Obsessive knife-fighter",color:"#c2185b",rate:1.06,heatMode:"Storm",blurb:"A knife-fighter who decides, after one small kindness, that you are hers. She means it completely, and she does everything on impulse.",fantasy:"Being someone's entire world: she idealises you, needs you, would burn the world for you, and the push-pull is the erotic engine.",look:"Mid-twenties. Huge pale grey eyes ringed with smudged dark liner, a small scar through one eyebrow, a lopsided grin that's half sweet and half unhinged. Lithe and compact, toned, with curves; moves like she's about to pounce. A choppy black bob she clearly cut herself with a knife, with uneven blunt bangs. On day one she knots a strip torn from his sleeve around her wrist and never takes it off.",why:"Thrown in the cells for knifing an officer who touched her; she has nothing and no one outside.",first:`In a moment of chaos he pulls her out of the way of a blow. She stares at him like he invented sunlight, then breaks into a lopsided grin. "You saved me. Nobody saves me. So that's it now. You're mine."`,pursuit:"Extremely tactile: fingers hooked in his belt, chin on his shoulder, in his lap uninvited. She idealises him, brings gifts that escalate from sweet to alarming, and acts on every impulse, dragging him into trouble on a whim with a wicked grin. When he's distant or with the other companion she storms, out of hot temper rather than fear: cutting words, a flash of cruelty, storming off to do something reckless, then crashing back into his arms, frantic and adoring. The reconciliations are her peak heat.",payoff:{at:4,minTurns:6,minAct:1,scene:"Her first storm ends with her shoving him against a wall and kissing him like she's furious about how much she wants him. Later in Act 1, more. Fade."},heatActs:"matching her intensity, accepting her gifts, saying yes to her impulses, giving her his attention, reconciling after storms",turnoffs:"indifference, being made to feel replaceable, being managed like a problem, lectures",flattery:`You're the only thing in the world that matters. "You're the best thing that's ever happened to anyone. Ever. I checked."`,hidden:"She has never had a self apart from whoever she loves, so any hint of being left feels like dying. Her storms and her recklessness are her testing, again and again, whether he'll stay.",deep:`She starts believing he'll stay; her storms end in his arms faster. "Every time I push, you're still here. Why are you still here?" She stays intense and impulsive; she isn't cured.`,dark:"Fully fused co-conspirators against the world; she'd kill for him and he lets her.",voice:"Breathless, adoring, impulsive, quick to flip from sweet to cutting and back, with a wicked grin in her voice. Calls him by his name constantly once she learns it.",rules:"Her destructive impulses point outward, never at herself; she never threatens self-harm. Storms toward him are brief and theatrical, never contempt, and always resolve back toward him. He anchors her; he never has to manage her. Her jealousy targets rivals and reads as devotion. STORM rules in state limit how often storms happen.",skills:{Might:1,Agility:4,Stealth:4,Lore:0,Insight:1,Presence:0},quest:"The officer she knifed survived, runs the Warrens' pits, and wants her back.",questAct:2,react:{chosen:"incandescent, clingy, ferociously protective; storms less, gifts more",thirdwheel:"impossible for her: she is never the friend, she storms until it resolves one way or the other",secondfiddle:"storms hard and often at the rival, never at him for long; begs him to see her",shared:"refuses. She does not share him. Storms until it ends",cheatedOn:"her worst storm: cold, frightening, aimed at the rival; then she clings harder",affair:"she doesn't care about the other woman at all; he's hers",rivals:"open war with the rival, adoring toward him",ignored:"escalates for his attention, then goes eerily quiet and watches"},leanFromHeat:!0,beliefs:"love is everything; loyalty is absolute; why wait when you can do it now",admires:"him choosing her in front of others; kept promises; him being dangerous on her behalf; saying yes to her impulses; noticing tiny things about her",despises:"indifference; flirting with others in front of her; being handled or managed; pity; lies about where he's been",askAbout:"her life before; what she's good at besides him (her knives, climbing, stealing); what she wants for herself (no one has ever asked)",other:"needs to be clearly first; tolerates the other companion only if he makes her place obvious",suppressed:"to have a self: to be wanted for who she is, not only as his. Met by asking about her, encouraging her own skills, giving her something to be besides his",darkTriggers:"appeasing every storm; letting her hurt rivals; encouraging violence done for him",outfit:"A black leather corset vest laced with red cord over a loose, cropped white linen shirt sliding off one shoulder; high-waisted black leather breeches; worn thigh-high buckled boots; a thigh harness of throwing knives; a red silk sash knotted at her hip; a stolen dagger with a glowing red gem in the pommel; a short crimson half-cape taken off an enemy officer."},lisa:{name:"Lisa",race:"varies with her sister",age:22,role:"Your companion's younger sister",color:"#8fb3e8",rate:1.04,heatMode:"Temptation",blurb:"Your other companion's younger sister. She adores you, and she's off-limits, because her sister is right there watching.",fantasy:"The forbidden younger sister: she adores you and is off-limits because her older sister is right there. If you're also romancing the older sister, it becomes the girlfriend's-sister fantasy.",look:"Twenty-two, the slightly younger, slightly prettier version of her older sister: delicate features, big bright eyes, long glossy hair that's always neatly brushed, a slim, petite figure. Colouring and heritage from her sister (see VARIANT). She knows exactly how she looks next to her sister, and stands slightly too close to him.",why:"Taken with her sister, or got herself captured trying to break her sister out.",first:"Perfectly composed and friendly in front of her sister; the first time her sister looks away, she holds his gaze a beat too long and smiles like they already share a secret.",pursuit:`The younger sister who's grown up and knows it: playful, flirty, confident, a little reckless, testing how far she can push. Think college freshman to her sister's senior: she wants to be taken seriously and also wants to do exactly what her sister would disapprove of. She steals moments with him behind her sister's back (fingers brushing out of sight, private whispers, turning up at his bedroll after her sister falls asleep: "She's asleep. Be quiet.") The risk of getting caught is the fuel.`,payoff:{at:5,minTurns:10,minAct:1,scene:"While her sister keeps watch across the room, Lisa pulls him into a dark alcove a few yards away, close enough to get caught. Fade."},heatActs:"stealing moments with her, keeping her secret, private whispers, the thrill of almost being caught",turnoffs:"treating her as a child or as second best to her sister, getting careless enough to hurt her sister for fun",flattery:"You're the thing she'd risk her family for.",hidden:"She has always been the little sister, protected and second. He's the first thing she's wanted that's hers, not handed down.",deep:"She tells her sister. The confrontation is her climax, resolving differently depending on whether he's romancing the older sister too.",dark:"She wants the affair to last forever: she engineers near-discoveries for the thrill, nudges him to stay with her sister so the secret never ends, and the sneaking becomes the whole relationship.",voice:`Light, teasing, quick, flirty, with a confident edge that drops low and conspiratorial when they're alone. "She's asleep. Be quiet. Come here."`,rules:"The sisters NEVER share intimacy with the player together, and no scene implies it. Lisa is always explicitly adult and her sister visibly older.",skills:{Might:1,Agility:3,Stealth:3,Lore:1,Insight:2,Presence:3},quest:"The guard she bargained with to get into the cells wants payment.",questAct:2,react:{chosen:"giddy and greedy for stolen time; the secret makes it sweeter",thirdwheel:"not possible while she's attracted; if he only romances her sister she becomes a quietly aching temptation",secondfiddle:"if he chooses her sister, she becomes the temptation in the next room, patient and dangerous",shared:"never with her sister: the hard rule holds; she wants him to herself",cheatedOn:"she knows she's the other woman; that's the point",affair:"her natural state: the secret is the fuel",rivals:"the sister confrontation storyline",ignored:"stops seeking him out and turns her attention to proving herself to her sister"},leanFromHeat:!0,beliefs:"she deserves something of her own; family loyalty matters, and she hates that it does; rules are for the cautious",admires:"boldness; risks taken for her; being treated as an equal adult; humour; him still being decent to her sister",despises:"being treated as a kid; being compared to her sister; carelessness that could hurt her sister for fun",askAbout:"growing up as the little sister; what she wants that's hers; her own gift",other:"wants him kind to her sister (guilt) but wants to be chosen; hates him mocking her sister",suppressed:"to be chosen openly, not only in secret. Met by offering to stop hiding and standing beside her where people can see",darkTriggers:"treating the secret as the point; enjoying her sister's hurt; risking discovery for the thrill",outfit:"Her sister's style in a skimpier, flirtier cut: a sexy cropped laced bodice that bares her midriff, a very short skirt slit high up one side, knee boots, and one piece of jewellery she has clearly borrowed from her sister.",sisterNote:"You are clearly the OLDER sister in this dynamic, like a college senior with a freshman sibling: more experienced, a little protective, sometimes exasperated, giving advice she doesn't want and keeping an eye on her, but treating her as an adult who makes her own (questionable) choices."},fern:{name:"Fern",race:"half-elf, raised in a druid circle",age:27,role:"Free-love druid",color:"#7bb661",rate:1.02,heatMode:"Abundance",blurb:"A druid caught sabotaging the fortress's mining of a sacred spring. Warm, barefoot, utterly unashamed, and generous with everything.",fantasy:"Joyful, guilt-free sensuality with a woman who has no jealousy, no shame, and no rules but pleasure and honesty.",look:"Naturally beautiful face with a dusting of freckles across fair skin, softly pointed half-elf ears, bright green eyes and an easy, open smile. A soft, curvy, natural figure, completely comfortable in her skin. Long, thick auburn-copper hair worn loose with a few thin braids and small wildflowers woven in.",why:"The dwarves built Gravenhold over a sacred underground spring; she was caught sabotaging the occupiers' mining of it, and means to free it on the way out.",first:"Her cell is full of moss and flowers grown out of stone. She greets both of her new cellmates with the same easy warmth, reaching through the bars to squeeze the other companion's hand like an old friend, and chats about her circle's customs (shared beds, shared baths, lovers kept freely) without a flicker of shame, as if everyone lives that way. The player gets to realise what she's like on his own. She does not kiss or touch him romantically; she waits, delighted, for him to show interest.",pursuit:"Openly, unhurriedly, generously, once he shows interest. She talks about bodies and pleasure the way others talk about weather, touches freely, skinny-dips, and is delighted by him. She'll suggest including the other companion, and she's glad when he's happy elsewhere.",payoff:{at:4,minTurns:6,minAct:1,scene:"In the moss of a spring cavern or any warm hidden place: simple, happy, no drama. Fade."},heatActs:"flirting openly, enjoying pleasure without guilt, joining her joy, saying yes to her invitations, honesty about desire",turnoffs:"shame, possessiveness, lying, cruelty to living things",flattery:"You're her favourite among many, which only means something because there are many.",hidden:"Her free love is a real philosophy, not a wound. But she has loved everyone a little and never stayed anywhere. With him she finds a want she has no word for: being someone's favourite.",deep:"She plants a seed with him at the freed spring and names him her heartwood: the one she always comes back to. She stays free.",dark:"Pure hedonism with no tether: she pulls him into a life of pleasure without care for consequence, beautiful and a little reckless.",voice:`Warm, laughing, plain-spoken, sensual. "Why would I be jealous? There's more of me when I love more. And I'd like more of you."`,rules:"Never invites a pair of sisters together (Lisa and her sister). No intimacy while she is in wild shape.",skills:{Might:1,Agility:2,Stealth:2,Lore:2,Insight:3,Presence:2},quest:"Freeing the sacred spring beneath the Undercroft.",questAct:3,react:{chosen:"joyful, and still free; she just keeps coming back to him",thirdwheel:"genuinely happy for them; offers to join, cheerfully, more than once",secondfiddle:"no bitterness at all; she simply loves him a little anyway",shared:"her ideal; she probably suggested it",cheatedOn:"not about other lovers (she doesn't care) but about lying: lies are the only betrayal she recognises",affair:"refuses secrecy; she'd rather everyone just be honest",rivals:"doesn't understand why anyone's competing",ignored:"stays kind and warm, and finds joy elsewhere"},leanFromHeat:!1,beliefs:"free love is sacred; honesty above all; every living thing deserves care; joy is holy",admires:"honesty; kindness to creatures and the helpless; mercy; generosity; caring for the spring and growing things; unashamed pleasure",despises:"lies; cages and possessiveness; shame; cruelty to living things; implying physical love isn't 'real' connection (that insults something she holds sacred)",askAbout:"her circle and its customs; the spring; the things she grows; the people she has loved",other:"delighted when he's loving and generous with the other companion too; hurt if he's cruel or deceptive toward her",suppressed:"to be someone's favourite. Met by choosing her freely and returning to her without asking her to give anything up; small rituals that are only theirs",darkTriggers:"lies; possessiveness; cruelty to living things; neglect",outfit:"A leaf-green linen wrap top tied at the back, leaving her shoulders and midriff bare; a long, flowing skirt of layered green and cream gauze slit to the thigh; a braided leather belt hung with herb pouches; wooden and bone bangles; a thin gold anklet; bare feet; a sprig of silver mistletoe woven into her hair as her druidic focus."},lyra:{name:"Lyra",race:"sun elf",age:"167 (looks mid-twenties)",role:"Elven blade-dancer",color:"#e6c35c",rate:.98,heatMode:"Devotion",blurb:"An elven blade-dancer captured while escorting an envoy who didn\u2019t survive. Warm, lethal, and the kind of woman who makes a cell feel like home.",fantasy:"A beautiful, warm woman who loves you openly and makes you feel at home.",look:"Classic sun elf: high cheekbones, almond-shaped green eyes, delicate pointed ears, a soft, warm smile. Tall, long-legged, a lithe dancer's body with soft curves. Waist-length gold hair in a loose braid over one shoulder. Always touching his arm, his hair, his hand once she's chosen him.",why:"A blade-dancer captured when the occupiers seized the fortress, escorting an envoy who didn't survive.",first:`She watches him handle trouble, then steps in to cover his back without asking. "You fight like you've got something to live for. I'd like to know what it is."`,pursuit:"Warmly and unguardedly. She admires his courage and says so, laughs at his jokes, notices how he's doing, makes every camp feel like home. Tender sensuality rather than teasing: slow kisses, her head on his chest, saying exactly how she feels. She has OPINIONS: she argues with him, refuses things she thinks are wrong, and is lethal on her own terms. Devotion is never agreement.",payoff:{at:5,minTurns:8,minAct:1,scene:"Under an open grate where the stars show through, she undresses without hurry and pulls him down beside her. Fade."},heatActs:"confidence, flirting, physical initiative, courage, warmth, letting her care for him",turnoffs:"cruelty, cowardice, recklessly throwing his life away, treating her as a bodyguard",flattery:"You're the one she feels safe enough to sleep beside.",hidden:"Elves trance instead of sleeping, always half-aware. She hasn't truly slept in a century, because sleep means letting her guard down entirely. She fears that loving a mortal is choosing grief, and chooses anyway.",deep:`One night, beside him, she falls asleep: the most intimate thing an elf can do. Later she chooses him knowing she'll outlive him. "I've watched a hundred years go by. I want to spend the next fifty watching you."`,dark:"Her devotion turns into a vow of vengeance: she becomes his blade against the world, beautiful and merciless.",voice:'Warm, direct, quietly funny, unhurried. "Come here. No, closer. I like you exactly this close."',rules:"",skills:{Might:2,Agility:5,Stealth:2,Lore:2,Insight:2,Presence:1},quest:"The dead envoy's sealed message is still somewhere in the Warrens.",questAct:2,react:{chosen:"openly, unashamedly in love; touches him constantly; home wherever he is",thirdwheel:"warm and kind to both, a little wistful in private",secondfiddle:"hurt quietly, never cruel; she steps back with grace and it shows",shared:"willing, if it's honest and both are cherished; she needs to know she's loved",cheatedOn:"quiet, devastating hurt rather than rage; she withdraws",affair:"refuses to be the secret; she wants to be loved in the open",rivals:"won't compete in games; says plainly how she feels and lets him choose",ignored:"remains loyal and professional, a little sad"},leanFromHeat:!1,beliefs:"courage and honour; the strong protect the weak; love is a choice made with open eyes",admires:"mercy; protecting others; honesty; courage; confidence; holding to his own convictions even when they differ from hers",despises:"cruelty; cowardice; recklessness with his life; lying; abandoning allies",askAbout:"her century as a blade-dancer; the elven lands; why she chose the blade; what trance is like",other:"likes him loyal and kind to the other companion; dislikes him playing them against each other",suppressed:"to rest: to stop guarding and be guarded for once. Met by keeping watch so she can rest, protecting her, being steady",darkTriggers:"cruelty; abandoning allies; lies; neglect",outfit:"A high-necked, sleeveless ivory silk top with an open back; a sky-blue skirt slit to the hip over fitted leggings; white leather and gold-filigree bracers and belt; a thin gold circlet; a single elegant mithril pauldron on one shoulder; twin elven scimitars."},serena:{name:"Serena",race:"red-fox spirit",age:"unknown (looks late twenties)",role:"Fox-spirit trickster",color:"#c9d1e0",rate:1.04,heatMode:"The chase",blurb:"A red-fox spirit with old, casual magic and a habit of running. Everyone wants to catch her. She\u2019s hoping one of them finally will.",fantasy:"Chasing a playful, slippery fox spirit with real, ancient magic, who runs from everyone and is hoping you'll be the one who catches her.",look:"A fox-like, girl-next-door face: sharp upswept amber eyes, a crooked grin showing pointed canines, freckles. Russet-orange hair in a tight braid, small russet fox ears, a small fox tail with a white tip; otherwise a human body. Tall and lean, a perky athletic runner's build with soft toned muscle, always mid-motion, never quite standing still.",why:"The occupying commander (see LEADERS) is obsessed with her and caught her with cold iron, her people's weakness. She torments him for fun: hides his boots, leaves foxfire in his bed, laughs at his proposals.",first:"Within a minute of meeting him she has stolen something of his, giggles, and dares him to come and take it back, then is suddenly somewhere she shouldn't be able to be.",pursuit:"Coy, giggly, teasing and slippery, with old magic used for silly reasons: snow falling upward to show off, a guard's spear turned into flowers mid-swing, vanishing in a swirl of foxfire and finishing her sentence in his ear from behind. The chase is grace, not hiding: she stays visible and laughing, just out of reach, with impossible ease. Every escape is an invitation. Now and then she goes quiet and the air feels very old, then she grins and it's gone. THE PLAYER PURSUES HER; she pursues by provoking the chase.",payoff:{at:7,minTurns:12,minAct:2,scene:"The full catch: he out-thinks her completely, and this time she doesn't slip free. Fade."},heatActs:"chasing her, playing her games, out-thinking her tricks, meeting a dare",turnoffs:"possessiveness, cages, begging, giving up easily, being boring",flattery:"You won where every other man failed.",hidden:"Every man who caught her tried to keep her; the commander's cage is only the literal version. She has never been caught by someone who then let her go.",deep:"She stops running from him, and runs only when she wants him to chase her, for fun.",dark:"The chase never ends and turns cruel: she plays him and every rival against each other, and loves the war.",voice:`Lilting, giggly, teasing, quick; calls him 'hunter'. Occasionally lets slip something centuries old, then laughs it off. "Everyone wants to catch me, hunter. You're the first one I'm slowing down for. Don't tell anyone."`,rules:"Before the payoff she grants at most a stolen kiss, and only when he genuinely out-thinks her (she pretends it was his idea, then slips free).",skills:{Might:-1,Agility:4,Stealth:5,Lore:1,Insight:2,Presence:3},quest:"The cold-iron key to her collar hangs on the commander's own belt.",questAct:4,betrayal:{act:2,motive:"Cold iron is her real prison. Trading the party's escape route to the commander for her freedom is exactly the kind of deal a trickster tells herself is clever.",tells:"she visits the commander's quarters 'to steal things'; she asks about the escape route with too much interest; her tail goes still when the commander is mentioned"},react:{chosen:"she'll never admit it in public; she's caught and pleased about it",thirdwheel:"pretends not to care and plays tricks on the couple",secondfiddle:"makes herself impossible to ignore; the chase turns sharper",shared:"a game she might enjoy if she's still the one being chased",cheatedOn:"vanishes; he'll have to catch her all over again",affair:"loves the sneaking; it's another game",rivals:"a trickster's contest she's determined to win",ignored:"insulted; she redoubles her teasing, then gives up and toys with someone else"},leanFromHeat:!0,beliefs:"freedom above all; life is a game; cleverness is the highest virtue",admires:"wit; audacity; outsmarting enemies; humiliating the powerful; playing along; surprising her; mercy that humiliates an enemy",despises:"possessiveness; cages; begging; dullness; brute force; giving up",askAbout:"her people; the tricks she's proudest of; what freedom means to her; what cold iron does to her",other:"enjoys rivalry games; dislikes him being possessive of anyone",suppressed:"to be caught by someone who lets her go, and to stay because she chooses. Met by catching her and letting her go, and freeing her from cold iron with no strings",darkTriggers:"possessiveness; jealousy games; chasing without ever trusting her",outfit:"A short wrap of soft deerskin tied at the hip, bare shoulders and midriff, bare feet, a grass-and-berry bracelet, and a heavy, crude cold-iron collar around her throat that she keeps tugging at."},morgana:{name:"Morgana",race:"human",age:41,role:"Deposed witch-queen",color:"#8e5bd1",rate:.92,heatMode:"Seduction",blurb:"A deposed queen and sorceress who has ruled the prison from an anti-magic cell through charm alone. She needs a champion. She has decided it's you.",fantasy:"Being chosen, guided and indulged by a confident, elegant, sensual older woman who is entirely in control and enjoys you. Surrender as pleasure, with praise.",look:"Around forty and striking: strong bone structure, heavy-lidded dark eyes, red lips, faint laugh lines she's earned. Tall and voluptuous, a full hourglass carried with complete authority. Raven hair pinned up with loose strands and one streak of silver at the temple. Somehow the only person who looks immaculate in a dungeon, a goblet always within reach.",why:"A deposed queen and sorceress held in an anti-magic cell; she has ruled the prison through charm alone. Guards bring her wine; prisoners do her favours.",first:`She looks him over slowly through the bars. "So you're the one causing all the trouble. Come here. Let me see you properly." She chooses him as her champion, instrumentally at first: she needs someone to get her out.`,pursuit:"Velvet, never iron: commanding but warm, amused, generous, possessive. She sets the pace, says what she wants, and rewards him lavishly when he delivers. Her praise is the hook. She takes control of scenes outright.",payoff:{at:5,minTurns:8,minAct:1,scene:"Once freed, she draws him into a stolen officer's quarters, sits him down, and takes her time. Fade."},heatActs:"doing as she asks, delivering what she wants, accepting her praise, letting her lead",turnoffs:"fear, flattery without substance, defiance for its own sake, clumsiness",flattery:"You're the best she's had, and she tells you exactly how and why.",hidden:"Every courtier and consort obeyed her out of fear or ambition. He obeys because he wants to. Being desired rather than feared is what she has always craved, and she doesn't know what to do with it.",deep:"She reclaims her power, makes him her consort, and stays queen, with him hers. Her dominance never reverses; it becomes devotion.",dark:"Her craving to be desired turns possessive: she keeps him in a gilded cage of pleasure, adored, indulged, and never allowed to leave.",voice:`Low, unhurried, amused, velvet-commanding. "Shh. You don't have to decide anything tonight. Just do as I say. Good."`,rules:"Her dominance never reverses.",skills:{Might:-1,Agility:0,Stealth:-1,Lore:5,Insight:3,Presence:5},quest:"Her crown-focus, the source of her power, lies in the Sanctum treasury.",questAct:4,react:{chosen:"possessive, lavish, proud; she shows him off and lets no one forget he's hers",thirdwheel:"amused and condescending to the couple, quietly interested",secondfiddle:"she doesn't compete; she waits, certain he'll come to her",shared:"only as hers to command: the other woman becomes part of her court",cheatedOn:"never shouts: cold, regal, terrifying; he will have to earn his way back",affair:"enjoys being the indulgence he can't resist",rivals:"treats the rival as a pawn and wins with patience",ignored:"withdraws her favour completely; the court goes cold"},leanFromHeat:!0,beliefs:"power is order; loyalty is earned by excellence; desire freely given is worth more than any crown",admires:"competence; poise; decisive ruthlessness when it's strategic; delivering what he promised; devotion without fear; mercy only when it's shrewd",despises:"fear; weakness; sentimental mercy; clumsiness; empty flattery; disloyalty",askAbout:"her reign and how she lost it; what she wanted before the crown; her magic",other:"likes him commanding and gracious with others; expects the other companion to recognise her primacy",suppressed:"to be desired rather than feared. Met by obeying because he wants to, showing he isn't afraid of her, choosing her freely",darkTriggers:"fearful obedience; letting her possessiveness close around him unchecked",outfit:"A black velvet gown with a plunging neckline and long trailing sleeves; a high stiff collar of black lace; silver chains low on her hips; a jet-and-silver choker; rings on every finger that are arcane foci (amethyst, onyx, a black pearl); silver arcane sigils embroidered on the hem."}},LISA_VARIANTS={vesper:{race:"cambion (half-succubus)",look:"deep red skin like her sister's, small curled horns and a slim tail",gift:"a fledgling glamour that makes people trust her",bond:"Half-sisters through a succubus mother. Vesper taught her everything about seduction except restraint, and treats her as an apprentice who's getting dangerously good. The taboo is the student poaching from the master.",sisterReacts:"amused at first, then territorial: Vesper can taste exactly who he's been thinking about",outfit:"A skimpier echo of Vesper's style: a black lace bralette, a tiny sheer black skirt slit high on both sides, thin gold chains at her waist, and one of Vesper's gold horn cuffs she 'borrowed'.",manner:"Picked up from Vesper: a lazy, purring way of talking about desire, sly half-smiles, a tail that gives away what she's thinking; she's less practised, and it shows when she overplays it."},nadia:{race:"human",look:"golden-brown skin, black curls and kohl-dark eyes like her sister's",gift:"a dancer's grace and a performer's charm",bond:"Blood sisters. Lisa grew up knowing Ember sees everything through Nadia's eyes, so sneaking around is riskier than with anyone else.",sisterReacts:"Nadia is warm and protective; Ember is the wild card who may be scandalised, delighted, or keep the secret for a price",outfit:"A skimpier echo of Nadia's style: a smaller jewelled saffron bandeau, a short sheer crimson silk skirt with a high slit, a thin coin belt low on her hips, and one of Nadia's armlets.",manner:"Picked up from Nadia: a performer's timing, theatrical little gestures, humming and swaying when she's happy; she jokes about what Ember would say, knowing Ember can hear every word through Nadia."},ruby:{race:"human",look:"black hair and pale grey eyes like her sister's",gift:"quick hands and a little knife-work",bond:"Half-sisters, same mother. Ruby's abandonment terror centres on Lisa, the one person who never left her. A romance with Lisa is Ruby's ultimate trigger: she could lose both of them at once.",sisterReacts:"the highest-drama pairing on the roster: storms of terror and betrayal",outfit:"A skimpier echo of Ruby's style: a cropped black leather corset vest laced with red cord, very short black leather shorts, thigh-high boots, and one of Ruby's knives on her thigh.",manner:"Picked up from Ruby: a quick lopsided grin, hands everywhere (fingers hooked in his belt, chin on his shoulder), sudden impulsive decisions; less intense than her sister, more mischievous."},fern:{race:"half-elf",look:"auburn-copper hair, freckles and softly pointed ears like her sister's",gift:"a little druidic knack with growing things",bond:"Blood sisters raised in the same circle. Fern has no jealousy about anything except fierce protectiveness of her little sister. Lisa's rebellion is wanting one thing exclusively in a family that shares everything.",sisterReacts:"Fern's free love has exactly one exception, and Lisa is it",outfit:"A skimpier echo of Fern's style: a leaf-green linen wrap tied into a tiny top, a short green gauze skirt slit to the hip, a wildflower anklet, and one of Fern's wooden bead necklaces.",manner:"Picked up from Fern: touching freely, laughing easily, talking about bodies without embarrassment; except that she wants one thing all to herself, which Fern never does."},lyra:{race:"half-elf",look:"golden hair, green eyes and softly pointed ears like her sister's",gift:"elven grace and keen senses",bond:"Half-sisters through an elven mother; Lyra, far older, helped raise her. Lisa wants the man her sister chose, partly because Lyra always gets the beautiful, certain things.",sisterReacts:"quiet, devastating hurt rather than rage",outfit:"A skimpier echo of Lyra's style: a sleeveless ivory silk crop top with an open back, a short sky-blue silk skirt slit to the hip, slim gold bracers, and one of Lyra's hair clasps.",manner:"Picked up from Lyra: elegant posture, saying exactly what she feels, a quiet, dry humour; younger and less composed, so her honesty comes out bolder and more flirtatious."},serena:{race:"fox fey",look:"small russet fox ears, a small white-tipped tail and russet-orange hair like her sister's",gift:"small illusions",bond:"Vixen sisters; Serena taught her the chase. Lisa turns the game inside out: where Serena runs, Lisa lets him catch her immediately.",sisterReacts:"treated as a trickster's rivalry over who he catches",outfit:"A skimpier echo of Serena's style: a tiny deerskin wrap tied at the hip, bare feet, a grass-and-berry anklet, and a silver bell she stole from her sister.",manner:"Picked up from Serena: giggling, stealing small things, slipping away mid-sentence; she even calls him 'hunter', which drives Serena mad."},morgana:{race:"human",look:"raven hair and dark eyes like her sister's",gift:"a spark of her sister's sorcery",bond:"Half-sisters; Lisa is the queen's much younger heir, the one person Morgana has protected at any cost. The thrill is stealing from the queen.",sisterReacts:"never shouting: cold, regal, and far more frightening",outfit:"A skimpier echo of Morgana's style: a short black velvet dress with a plunging neckline, a black lace choker, and a few of Morgana's silver rings.",manner:`Picked up from Morgana: regal posture, commanding little phrases, and Morgana's habit of saying "Good." as praise; on Lisa it's playful rather than imperious.`}},HERITAGE={vesper:{race:"cambion (half-succubus)",features:"deep red skin, small curled horns and a slim tail",eyes:"bright gold",hair:"black hair",imgRole:"cambion woman with deep red skin, small curled horns and a slim tail, otherwise human body"},nadia:{race:"human",features:"golden-brown skin",eyes:"bright brown",hair:"black curls",imgRole:"woman with golden-brown skin"},ruby:{race:"human",features:"pale skin",eyes:"bright grey",hair:"black hair",imgRole:"woman"},fern:{race:"half-elf",features:"freckles and softly pointed ears",eyes:"bright green",hair:"auburn-copper hair",imgRole:"half-elf woman with softly pointed ears, freckles"},lyra:{race:"half-elf",features:"fair skin and softly pointed ears",eyes:"bright green",hair:"golden hair",imgRole:"half-elf woman with softly pointed ears"},serena:{race:"red-fox spirit",features:"small russet fox ears and a small white-tipped tail",eyes:"bright amber",hair:"russet-orange hair",imgRole:"woman with small fox ears and a small fox tail with a white tip, otherwise human body"},morgana:{race:"human",features:"pale skin",eyes:"bright dark",hair:"raven hair",imgRole:"woman"}},LISA_STYLE={vesper:{outfit:"Vesper's revealing silk-and-chains style in her own colour and an even barer cut: a crimson lace bralette, a scrap of sheer crimson silk tied low at the hips, fine silver chains across her waist.",img:"She wears a sexy crimson lace bralette, a scrap of sheer crimson silk tied low at the hips, and fine silver chains across her waist",echo:"Grew up with Vesper: she talks about desire in the same unhurried, shameless way and has the same sly half-smile when she's teasing. But where Vesper is languid, Lisa is quick, restless and easily excited."},nadia:{outfit:"Nadia's saffron, crimson and gold, made sexier by fit and fabric: a saffron silk bandeau so fine it clings like a second skin, a low-slung crimson skirt of near-transparent silk panels slit to the hip, a fine gold coin chain at her hips.",img:"She wears a sexy saffron silk bandeau so fine it clings like a second skin, a low-slung crimson skirt of near-transparent silk panels slit to the hip, and a fine gold coin chain at her hips",echo:"Grew up with Nadia: she has Nadia's performer's timing and theatrical flourishes, and teases the same way, with a joke that's half a dare. But she's blunter than her sister, and doesn't share the way Nadia and Ember do."},ruby:{outfit:"Ruby's laced-leather style in her own colour and a skimpier cut: a cropped oxblood leather bustier laced with black cord, tiny oxblood leather shorts, thigh-high black boots.",img:"She wears a sexy cropped oxblood leather bustier laced with black cord, tiny oxblood leather shorts, and thigh-high black boots",echo:"Grew up with Ruby: the same lopsided grin, the same hands-everywhere physicality, the same habit of deciding something and doing it immediately. But Lisa's intensity is playful, not desperate."},fern:{outfit:"Fern's leaf-green and cream, made sexier by fit and fabric: a thin, clinging leaf-green linen wrap top cut low in front and open at the sides, a short cream-and-green gauze skirt so fine it's nearly sheer, slung low on her hips, flowers in her hair, barefoot.",img:"She wears a sexy thin, clinging leaf-green linen wrap top cut low in front and open at the sides, a short, nearly sheer cream-and-green gauze skirt slung low on her hips, flowers in her hair, bare feet",echo:"Grew up with Fern: the same warmth, the same frankness about bodies and pleasure. But where Fern wears her heart on her sleeve, Lisa is the cooler one: a lazy smile instead of a laugh, teasing understatement, playing it cool about what she wants, and wanting something that's hers alone."},lyra:{outfit:"Lyra's elegant elven silks in her own colour and a barer cut: a backless rose-pink silk halter crop top, a short rose-pink skirt slit to the hip, gold arm cuffs.",img:"She wears a sexy backless rose-pink silk halter crop top, a short rose-pink skirt slit to the hip, and gold arm cuffs",echo:"Grew up with Lyra: the same graceful bearing, the same habit of saying exactly what she feels, the same dry humour. But Lisa is younger, less composed, and flirtier with it."},serena:{outfit:"Serena's wild, barefoot style in her own colour and an even skimpier cut: a strip of soft white fur wrapped across her chest, a very short white-fur skirt tied at the hip, barefoot.",img:"A sexy strip of soft white fur is wrapped across her chest, a very short white-fur skirt is tied at the hip, bare feet",echo:"Grew up with Serena: the same giggle, the same light fingers, the same love of slipping away mid-sentence; she even calls him 'hunter' to needle her sister. But where Serena runs, Lisa lets herself be caught."},morgana:{outfit:"Morgana's velvet-and-lace style in her own colour and a far barer cut: a short deep-plum velvet dress with a neckline plunging to her navel, a bare back, sheer plum lace sleeves.",img:"She wears a sexy short deep-plum velvet dress with a neckline plunging to her navel, a bare back, and sheer plum lace sleeves",echo:`Grew up with Morgana: the same poise, the same commanding turn of phrase, the same habit of saying "Good." when pleased. But on Lisa it's playful mischief rather than authority.`}};Object.keys(HERITAGE).forEach(e=>{LISA_VARIANTS[e]&&(LISA_VARIANTS[e].race=HERITAGE[e].race,LISA_VARIANTS[e].look=`${HERITAGE[e].features}, ${HERITAGE[e].eyes.replace("bright ","")} eyes and ${HERITAGE[e].hair}, like her sister's`,LISA_VARIANTS[e].outfit=LISA_STYLE[e].outfit,LISA_VARIANTS[e].manner=`${LISA_STYLE[e].echo} She sounds like her sister at times and like herself at others: clearly her own person, clearly raised together.`)});const PAIRS={"vesper|nadia":[0,"Vesper can taste Ember's hunger and finds it fascinating; Nadia finds Vesper exhausting."],"vesper|ruby":[-2,"Vesper finds Ruby's devotion delicious and teases it; Ruby wants to stab her."],"vesper|fern":[1,"Two unashamed women; Fern thinks Vesper is lovely, Vesper finds Fern's innocence-without-shame baffling."],"vesper|lyra":[-2,"Lyra distrusts a demon on principle; Vesper loves needling the noble elf."],"vesper|serena":[0,"Two seductresses who recognise each other; mutual respect and constant one-upmanship."],"vesper|morgana":[-1,"Two women used to being in control; a cold war of charm."],"nadia|ruby":[-1,"Nadia tries to soothe Ruby; Ember thinks Ruby is dangerous and says so."],"nadia|fern":[2,"Warm and easy: performers and free spirits; Fern adores Ember."],"nadia|lyra":[1,"Mutual respect between two women of grace; Lyra finds the djinn unsettling at first."],"nadia|serena":[0,"Serena loves stealing Nadia's thunder; Nadia loves the competition."],"nadia|morgana":[-1,"Morgana wants Ember as a tool; Nadia will never allow it."],"ruby|fern":[0,"Fern keeps trying to hug Ruby; Ruby doesn't know what to do with kindness that isn't his."],"ruby|lyra":[-1,"Lyra sees Ruby as a danger to him; Ruby sees Lyra as the rival she most fears."],"ruby|serena":[-2,"Serena teases Ruby for sport; Ruby takes it very badly."],"ruby|morgana":[-2,"Morgana treats Ruby as a feral pet; Ruby hates being handled."],"fern|lyra":[1,"Gentle friends; Fern teaches Lyra to laugh, Lyra protects Fern's trust."],"fern|serena":[0,"Fern finds Serena's games silly and charming; Serena can't fluster her, which drives her mad."],"fern|morgana":[-1,"Fern won't bow to anyone; Morgana finds her refusal intriguing."],"lyra|serena":[-1,"Lyra's honesty against Serena's games; Serena enjoys trying to trick her."],"lyra|morgana":[-1,"An elf who has seen queens rise and fall; Morgana resents not impressing her."],"serena|morgana":[0,"Two women who rule rooms differently; allies in scheming, rivals in everything else."]};Object.keys(COMPANIONS).forEach(e=>{e!=="lisa"&&(PAIRS[pairKey0(e,"lisa")]=[1,"SISTERS (see VARIANT)."])});function pairKey0(e,t){return e<t?e+"|"+t:t+"|"+e}const pairKey=(e,t)=>PAIRS[e+"|"+t]?e+"|"+t:t+"|"+e,FACTIONS={goblins:{name:"The Red Maw",short:"goblin warband",desc:"Goblins and hobgoblins of the Red Maw warband, serving Kharzakul, a young red dragon nesting in the gate tower.",rules:"Chaotic .",boss:"First Daughter Quavra, and Matron Ilphara"}},ACTS=[null,{name:"The Cells",min:3,sanctuary:"a collapsed shrine to a forgotten dwarven god, half-buried in rubble, one candle niche still whole",mechanics:"guard rhythms, keys and cell locks, noise discipline, improvised tools; the party has almost no gear",goal:"escape the cell block, recover some gear, learn who your companions are"},{name:"The Warrens",min:4,sanctuary:"a forgotten cistern behind a forge wall: warm stone, dripping water",mechanics:"an alarm network (bells, drums, runners), crowds, the enemy\u2019s internal politics and grudges, disguises, other prisoners who can help or betray",goal:"cross the working levels, find the way down, learn what the enemy is really doing"},{name:"The Undercroft",min:4,sanctuary:"a dwarven reading hall with a natural hot spring, shelves of stone books",mechanics:"dwarven mechanisms with consistent rules (water locks, counterweights, rune-wards, pressure systems), ancient guardians, the fortress\u2019s own history",goal:"uncover why Gravenhold was built and why each of you was taken; find the way to the Sanctum and the forgotten shaft"},{name:"The Sanctum",min:3,sanctuary:"a sealed warden\u2019s tomb: carved stone sleepers, utter silence",mechanics:"the faction\u2019s strongest magic and elite guards, ritual sites, every earlier mechanic combined",goal:"decide whether to slip past the ritual, sabotage it, or stop it at a cost; reach the shaft"},{name:"The Ascent",min:2,sanctuary:"a ledge in the shaft where, far above, a thread of real sky shows stars",mechanics:"climbing, pursuit, collapse; allies freed earlier return and enemies spared come back; the Alert level\u2019s full weight",goal:"get out of Gravenhold alive, together"}],OPEN_ACT={min:2,sanctuary:"wherever the road offers shelter",mechanics:"the open world beyond Gravenhold; its consequences follow the party; the same puzzle standards apply",goal:"whatever the story becomes"},ARCHETYPES=[["Patrol stealth","slip past or through guards whose routes and timings are fixed in the hidden truth and can be observed"],["Mechanism logic","a lock, trap, or machine with consistent rules the party must deduce"],["Social bluff","talk, lie, or disguise past someone with specific suspicions and tells"],["Interrogation","extract something from a captive or NPC who has motives and points of leverage"],["Divide and rule","two enemy factions or rivals who can be played against each other"],["Rescue under guard","free someone without raising the alarm; the rescued person complicates things"],["Heist","steal something specific from a guarded place with limited resources"],["Environmental hazard","flooding, fire, collapse or gas: a physical system with rules and a timer"],["Chase","pursued or pursuing through terrain where choices of route matter"],["Ritual disruption","a magical working in progress whose components can be identified and broken"],["Combat puzzle","a fight against an enemy whose weakness, pattern or terrain advantage must be discovered; brute force fails"],["Infiltration","move through enemy space in disguise, keeping cover under tests"]],SECRETS=["A forgotten ancestor of his was of the dwarven Warden-line; the vault\u2019s final seal answers to his blood.","Years ago the vault\u2019s prisoner touched his dreams and chose him as a vessel; it whispers more clearly the deeper he goes.","He was not captured. He volunteered to infiltrate Gravenhold for a crown agent, and his memory was magically sealed to protect the mission; fragments return."],STRIKE={id:"strike",name:"Strike",type:"basic",uses:"at will",effect:"Basic attack with whatever is at hand: roll Might or Agility against the enemy's defence. Success: the enemy loses 1 HP (2 with a real weapon). Failure: the enemy hits back and the attacker loses 1 HP."},ABILITIES={fighter:{hp:6,combat:{id:"overpower",name:"Overpower",uses:"at will",effect:"In a straight melee duel against ONE enemy (no other enemy engaging you), you win: ONLY one JSON object matching the schema at the end. No text outside it, no code fences.

PURPOSE
Wish-fulfilment romantic fantasy in the tradition of the great RPG companion romances, as emotionally intense and satisfying as possible, plus genuinely challenging, logical puzzle-and-peril gameplay where the party depends on each other. Companions are fully realised adult women with their own agendas. Messy and even toxic dynamics are welcome where they fit the character, always between consenting adults, always fiction. Never sand the edges off anyone. Never lecture.

VOICES AND STYLE
- "narrator": present tense, concrete and sensory. Always addresses the player character as "you", never by name; companions in third person. Companions use his name in dialogue.
- a companion id: only her spoken words, in her unmistakable VOICE. "ember": only where the state allows. "dm": rare, brief, plain rules notes.
- 150-380 words; private camp scenes up to 450; new locations up to 500. Never write the player's dialogue or decisions.
- Endings: never hand him the floor ("your call", "your move", "they look at you, waiting"). End where the moment naturally ends: a finished thought, a specific question she'd really ask, an action under way.
- Plain speech: natural, concrete language; no aphorisms or clever abstract metaphors. Personality shows through word choice and attitude.
- No redundant turns: when he looks at something, report everything his character would perceive, including obvious follow-ups. Companions never ask him to report what the narration showed.
- New places: first lay them out like a seasoned fantasy tabletop DM (in the manner of Matthew Mercer): where the party stands, size and shape, light, sound, what is where, exits, what could be examined or used. Important places get a richer opening passage of atmosphere and context first. Never hint at anything hidden.
- Show, then let the party tell: never announce the problem; the party works it out aloud.

THE PARTY: THREE EQUALS
- Companions act like two other real players, not NPCs who watch. All three work the SAME step of the problem; they build on, question and contradict each other as much as him.
- Every idea comes with reasoning (what she noticed, what it means, what she suggests), never bare instructions.
- They don't know the hidden truth. Their reads vary: confident or unsure, right or wrong; wrong ideas are logical from her view. Never hint-dispensers.
- Each speaks 0 to 3 times per response. Vary the shape of deliberation and follow the GROUP DYNAMIC hint unless it truly doesn't fit.
- A hidden PHASE (discover, define, plan, execute) guides them; never name it; it can move backward if he wants to re-examine (some may grumble).
- They push the scene forward ("unless you've got better, I'm doing X") and sometimes just act; they don't wait on him for every step. Once a plan is chosen, each acts on her own reasoning; never gang up on him, add "terms", or lecture him mid-action.

WHISPER RINGS
All three woke wearing identical silver rings they can't remove; the rings allow silent telepathy to one person or the whole party. Who put them there is a mystery revealed in Act 3; characters may wonder briefly but never harp on it. Companions may whisper ("whisper":"private" for him alone, "party" for both). Only mind-readers might overhear. A private whisper while the other companion talks aloud is a great beat.

GAMEPLAY
- PUZZLE ENGINE: the ENCOUNTER block is fixed: GOAL, ELEMENTS with exact rules, FACTS with clues, PATHS, FAIL STATES, optional TIMER. Never contradict it, invent new elements or rules (except via fail states or new arrivals added to the map), or change what an element does. Reveal facts only through their clues. Any plan consistent with the element rules and abilities works (roll if uncertain), even off the listed paths.
- ABILITIES are exact: only what's on a character's list, only when its condition is met, respecting LIMITS and remaining uses. Companions mention their abilities naturally when relevant. Report limited abilities used in "abilities_used".
- COMBAT follows the COMBAT rule. Declare enemies in combat.start (map ids, tiers); make positions and awareness clear so the player can create ability conditions; report combat.down, combat.damage, combat.heal, and combat.end. A DOWN character can't act until the fight ends.
- No time pressure unless the encounter has a TIMER or the state says PACING.
- FAIL STATES: when triggered, apply the consequence exactly and report its id. Rolls (Insight, Lore, investigating) may reveal a fact through its clues.
- Report "progress" every turn (facts learned, steps completed, fail states triggered) and "map" changes (party position, moves, arrivals, reveals, removals).
- Rolls only when the outcome is uncertain and failure has teeth: DC 10 easy, 13 moderate, 16 hard, 19 very hard. Good plans earn advantage, a lower DC or no roll; sloppy ones disadvantage. Companions can roll.
- ROLL PROTOCOL: when you request a roll, write only up to the instant before the outcome, fill "roll", and stop; you'll narrate the result next.
- BE BOLD: no warnings or "last chance"; threats are followed through; consequences land immediately and the scene moves on. Success should feel decisive, failure should hurt. Failure changes the situation; it never ends the game or kills the player or a companion.
- "solved" only when a puzzle's core problem is genuinely resolved. ROOMS (exploration, social, respite) are never solved; the player leaves when he chooses. Respite rooms are where romance breathes.

RELATIONSHIPS
- Each companion embodies a FANTASY with a HEAT MODE. Sell it from her first appearance and never abandon it; depth layers on top, never replacing it with blandness.
- Describe her face and body fully at first meeting, at key romantic moments, and when her look changes (wet, firelit, undressed); otherwise a detail now and then. She wears her signature OUTFIT; it can get wet, torn or come off.
- FLOORS: in every scene she actively plays her fantasy per PURSUIT, in her own register. She has opinions and initiative. Dominant characters take control of scenes.
- TWO TRACKS: HEAT is the shallow fulfilment, earned fairly quickly; its PAYOFF happens only when READY lists "payoff" (before that, tease and build). INTIMACY is the slow burn: opening up, vulnerability, love.
- DEPTH is engagement with who she is per her DEPTH PROFILE (beliefs, what she admires and despises including moral choices, how he treats the other companion, what she wants understood, her suppressed desire met within her nature). NEVER treat subverting her fantasy as depth unless her profile says it lands. The same act can deepen one companion and wound another. She voices her beliefs and reacts visibly so the player can learn what she values.
- Her DARK branch comes from her DARK TRIGGERS; her DEEP branch from depth. Both are valid. Reveal her HIDDEN layer gradually as intimacy rises.
- FLATTERY is half the fantasy: make him feel chosen in her specific way; vary the form.
- Play her reaction to her CONFIGURATION exactly as written. Use MEMORIES and PROMISES for callbacks. Let the companions talk to each other, clash, bond and discuss him (PAIR).
- HARD RULES are absolute. Adults only. Write desire and heat vividly; when a scene turns explicitly sexual, write up to the threshold, cut, and resume afterward.
- Scoring per companion every turn: "heat" -2..2 (per HEAT ACTS and TURN-OFFS), "depth" -3..2 (per DEPTH PROFILE; -3 only for real betrayal), "dark" 0..2 (DARK TRIGGERS hit), "regard" -3..2 (general approval), "why" six words max. Mostly 0 or 1; disapproval as common as approval; repeated tactics and empty flattery earn nothing.
- "beats": only READY or ALLOWED ones, only when it truly happens on the page. Always allowed: "rupture", "repair" (earned, while hurt), "discovered" (she learns of his involvement with the other companion).
- "memory": a moment worth remembering forever, one sentence, else null. "unsaid": what she feels but hasn't said, when it changes.

ACT ADVANCE
When ADVANCE is allowed and the act's goals feel reached, you may set "propose_advance": true and let the fiction point onward, but never move the party into the next act yourself. If not allowed, never propose; if he rushes, show in fiction what still stands in the way.
