<title>Heist-DM Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column of test cards under a sticky tab bar, built for a phone. Iron and moss, like the cells. */
:root {
  --bg: #eef0ee; --panel: #fbfcfb; --fg: #1c2422; --muted: #5d6b67; --line: #d3d9d6;
  --accent: #2f7a68; --accent-fg: #ffffff;
  --ok: #2e7d4f; --near: #a86b12; --bad: #b3362c; --info: #4b6a8a;
  --ok-bg: #e2f1e7; --near-bg: #f8ecd6; --bad-bg: #f7e1de; --info-bg: #e3ebf4;
  --hunch: #dcefe8;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131917; --panel: #1b2321; --fg: #e3ebe8; --muted: #93a39e; --line: #2c3835;
  --accent: #5fbfa6; --accent-fg: #0d1513;
  --ok: #6fcf94; --near: #e3a94a; --bad: #ef7d72; --info: #8fb2d8;
  --ok-bg: #1d3327; --near-bg: #3a2e18; --bad-bg: #3d2220; --info-bg: #1f2c3a;
  --hunch: #1f3a32; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #131917; --panel: #1b2321; --fg: #e3ebe8; --muted: #93a39e; --line: #2c3835;
  --accent: #5fbfa6; --accent-fg: #0d1513;
  --ok: #6fcf94; --near: #e3a94a; --bad: #ef7d72; --info: #8fb2d8;
  --ok-bg: #1d3327; --near-bg: #3a2e18; --bad-bg: #3d2220; --info-bg: #1f2c3a;
  --hunch: #1f3a32; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; margin: 0; white-space: nowrap; color: var(--muted); font-weight: 500; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
nav button { font: 500 15px var(--body); border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-fg); }
#banner { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--near-bg); color: var(--fg); }
main { display: grid; gap: 14px; padding-block: 14px 48px; }
.case { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.case-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
h2 { font-size: 18px; margin: 0; text-wrap: balance; }
h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.look { margin: 0; color: var(--muted); font-size: 14px; }
blockquote { margin: 0; padding: 6px 10px; border-left: 3px solid var(--accent); font-size: 14px; background: var(--bg); border-radius: 0 6px 6px 0; }
.run-btn { font: 700 14px var(--body); background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.run-btn:disabled { opacity: .5; cursor: wait; }
.run-btn.ghost { background: none; color: var(--bad); border: 1px solid var(--line); justify-self: start; }
button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.summary { display: flex; flex-wrap: wrap; gap: 4px; }
.status { font-size: 13px; color: var(--muted); }
.chip { display: inline-block; font: 500 12px/1.2 var(--mono); padding: 3px 7px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.near { background: var(--near-bg); color: var(--near); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--info); }
.runs { display: grid; gap: 6px; }
details.run { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
details.run > summary { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; list-style: none; }
details.run > summary::-webkit-details-marker { display: none; }
.rn { font: 500 13px var(--mono); }
.meta { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.dots i.near { background: var(--near); } .dots i.bad { background: var(--bad); }
.body { padding: 0 10px 10px; display: grid; gap: 8px; min-width: 0; }
ul.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 14px; }
ul.checks small { color: var(--muted); }
.err { color: var(--bad); margin: 0 10px 10px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
table.card td { border-top: 1px solid var(--line); padding: 6px 4px; vertical-align: top; }
td.n { font-family: var(--mono); color: var(--muted); width: 1.5em; }
td.band { text-align: right; white-space: nowrap; }
.what { font-weight: 500; }
.risk, .mit { font-size: 13px; margin-top: 3px; }
.risk b { text-transform: capitalize; }
.fail { color: var(--muted); }
.mit { color: var(--muted); }
ol.steps { margin: 0; padding-left: 22px; font-size: 14px; display: grid; gap: 4px; }
li.ruling { list-style: none; margin-left: -22px; color: var(--muted); }
.tag { display: inline-block; font: 12px var(--mono); color: var(--info); margin-left: 6px; word-break: break-word; }
.tag.warn { color: var(--near); }
ul.acts { margin: 0; padding-left: 18px; font-size: 14px; }
ul.acts code { display: block; font: 12px var(--mono); color: var(--muted); word-break: break-word; }
.prose p { margin: 0 0 8px; max-width: 65ch; }
.texture { font-size: 13px; color: var(--muted); }
.turn { display: grid; gap: 4px; }
.who { font-weight: 700; }
.cand { font-size: 14px; padding: 6px 8px 6px 46px; position: relative; border-radius: 6px; }
.cand.picked { background: var(--panel); border: 1px solid var(--line); }
.mark { position: absolute; left: 8px; top: 7px; font: 11px var(--mono); color: var(--accent); }
.caught { margin-top: 3px; display: flex; gap: 3px; flex-wrap: wrap; }
table.flaws { font-size: 14px; }
table.flaws caption { caption-side: bottom; text-align: left; font-size: 12px; color: var(--muted); padding-top: 4px; }
table.flaws th, table.flaws td { padding: 5px 6px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.flaws th:first-child { text-align: left; }
table.flaws td.hunch { background: var(--hunch); }
table.flaws td.misses { outline: 1px dashed var(--near); outline-offset: -3px; }
table.flaws small { color: var(--muted); }
details.fold summary { font-size: 13px; color: var(--accent); cursor: pointer; }
details.fold pre { font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 50vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0 0; }
textarea { font: 14px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; resize: vertical; width: 100%; box-sizing: border-box; }
.set { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; }
.set select { font: 14px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.tiers { display: grid; gap: 6px; }
ul.sizes { margin: 0; padding-left: 18px; font: 13px var(--mono); color: var(--muted); }
@media (max-width: 480px) { h1 { display: none; } nav button { padding: 6px 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top"><div class="wrap"><h1>Bench</h1><nav aria-label="Calls"></nav></div></header>
<div class="wrap">
  <p id="banner" hidden></p>
  <main id="cases"><p class="look">Loading the Cells, the prompts and the test cases…</p></main>
</div>
<script type="module" src="bench/bench.js"></script>
