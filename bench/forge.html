<title>Three-Stage Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Alegreya+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column under a sticky tab bar. The bench's iron and moss, with a parchment tint on the
   player-facing pitch so what the player reads stands apart from what only the DM sees. */
:root {
  --bg: #eef0ee; --panel: #fbfcfb; --fg: #1c2422; --muted: #5d6b67; --line: #d3d9d6;
  --accent: #2f7a68; --accent-fg: #ffffff; --tint: #e3efe9;
  --player: #f6f1e4; --player-line: #d9cfb4;
  --ok: #2e7d4f; --near: #a86b12; --bad: #b3362c; --info: #4b6a8a;
  --ok-bg: #e2f1e7; --near-bg: #f8ecd6; --bad-bg: #f7e1de; --info-bg: #e3ebf4;
  --map-zone: #d8e6e0; --map-zone2: #e6dfcf; --map-edge: #5d6b67; --map-door: #b3362c; --map-open: #2f7a68;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Alegreya SC", "Alegreya Sans", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131917; --panel: #1b2321; --fg: #e3ebe8; --muted: #93a39e; --line: #2c3835;
  --accent: #5fbfa6; --accent-fg: #0d1513; --tint: #1f3a32;
  --player: #26231b; --player-line: #4a4331;
  --ok: #6fcf94; --near: #e3a94a; --bad: #ef7d72; --info: #8fb2d8;
  --ok-bg: #1d3327; --near-bg: #3a2e18; --bad-bg: #3d2220; --info-bg: #1f2c3a;
  --map-zone: #23403a; --map-zone2: #3a3426; --map-edge: #93a39e; --map-door: #ef7d72; --map-open: #5fbfa6;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #131917; --panel: #1b2321; --fg: #e3ebe8; --muted: #93a39e; --line: #2c3835;
  --accent: #5fbfa6; --accent-fg: #0d1513; --tint: #1f3a32;
  --player: #26231b; --player-line: #4a4331;
  --ok: #6fcf94; --near: #e3a94a; --bad: #ef7d72; --info: #8fb2d8;
  --ok-bg: #1d3327; --near-bg: #3a2e18; --bad-bg: #3d2220; --info-bg: #1f2c3a;
  --map-zone: #23403a; --map-zone2: #3a3426; --map-edge: #93a39e; --map-door: #ef7d72; --map-open: #5fbfa6;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
h1 { font: 500 15px var(--display); letter-spacing: .08em; margin: 0; white-space: nowrap; color: var(--muted); }
nav { display: flex; gap: 4px; min-width: 0; flex: 1; }
nav button { font: 500 15px var(--body); border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-fg); }
.speed { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
main { display: grid; gap: 14px; padding-block: 14px 64px; }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
h2 { font: 700 20px/1.2 var(--display); margin: 0; text-wrap: balance; letter-spacing: .02em; }
h3 { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; font-weight: 500; }
h4 { font-size: 16px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; }
label.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0; }
select, textarea, input[type="text"] { font: 15px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; box-sizing: border-box; min-width: 0; }
textarea { resize: vertical; }
.speed select { width: auto; font-size: 13px; padding: 3px 6px; }
button.go { font: 700 15px var(--body); background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.go:disabled { opacity: .5; cursor: wait; }
button.plain { font: 500 14px var(--body); background: none; color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button.plain.danger { color: var(--bad); }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-block; font: 500 12px/1.2 var(--mono); padding: 3px 7px; border-radius: 999px; background: var(--info-bg); color: var(--info); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.near { background: var(--near-bg); color: var(--near); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.accent { background: var(--tint); color: var(--accent); }
.status { font-size: 14px; color: var(--muted); }
.err { color: var(--bad); font-size: 14px; }
.prose { display: grid; gap: 8px; max-width: 68ch; }
.prose p { white-space: pre-wrap; }
.pitch { background: var(--player); border: 1px solid var(--player-line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.pitch .eyebrow { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pitch h2 { font-size: 24px; }
.pitch p { font-size: 17px; max-width: 62ch; }
.dm-tag { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
dl.kv { margin: 0; display: grid; gap: 6px; font-size: 15px; }
dl.kv > div { display: grid; grid-template-columns: 9em 1fr; gap: 10px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 520px) { dl.kv > div { grid-template-columns: 1fr; gap: 0; } }
.sub { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); display: grid; gap: 6px; min-width: 0; }
ol.acts { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ol.acts li { display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; }
.actn { font: 700 22px var(--display); color: var(--accent); line-height: 1; padding-top: 2px; font-variant-numeric: tabular-nums; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); }
td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
details.fold > summary { font-size: 13px; color: var(--accent); cursor: pointer; }
details.fold pre { font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 60vh; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0 0; }
.stage { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; min-width: 0; }
.stage-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.stage-head h3 { margin: 0; }
.history { display: grid; gap: 6px; }
.hist { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; text-align: left; font: 15px var(--body); color: var(--fg); width: 100%; }
.hist[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); }
.hist .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map svg { display: block; max-width: 100%; height: auto; }
.map text { fill: var(--fg); font: 11px var(--body); }
.opening { border-left: 3px solid var(--player-line); background: var(--player); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 16px; max-width: 68ch; }
.motifs { display: grid; gap: 4px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); }
.motifs label { font-size: 14px; display: flex; gap: 6px; align-items: baseline; color: var(--fg); }
@media (max-width: 480px) { h1 { display: none; } nav button { padding: 6px 9px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top"><div class="wrap"><h1>Forge</h1><nav aria-label="Benches"></nav><label class="speed">Speed <select id="speed"></select></label></div></header>
<div class="wrap">
  <main id="main"><p class="muted">Loading the prompts, the companions and the worked example…</p></main>
</div>
<script type="module" src="bench/forge.js"></script>
