<title>Dressing Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column under a sticky header that holds the companion strip. The bench's iron and moss, with
   each companion's own colour on her swatch, and the prompt text in mono so what the AI reads stands apart. */
:root {
  --bg: #eef0ee; --panel: #fbfcfb; --fg: #1c2422; --muted: #5d6b67; --line: #d3d9d6; --sunk: #e4e8e5;
  --accent: #2f7a68; --accent-fg: #ffffff; --accent-soft: #dcefe8;
  --ok: #2e7d4f; --near: #a86b12; --bad: #b3362c; --info: #4b6a8a;
  --ok-bg: #e2f1e7; --near-bg: #f8ecd6; --bad-bg: #f7e1de; --info-bg: #e3ebf4;
  --mark: #f3dd8a; --mark-fg: #2a2210; --add: #cfe9d8; --del: #f3d3cf;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Alegreya SC", "Alegreya Sans", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131917; --panel: #1b2321; --fg: #e3ebe8; --muted: #93a39e; --line: #2c3835; --sunk: #161d1b;
  --accent: #5fbfa6; --accent-fg: #0d1513; --accent-soft: #1f3a32;
  --ok: #6fcf94; --near: #e3a94a; --bad: #ef7d72; --info: #8fb2d8;
  --ok-bg: #1d3327; --near-bg: #3a2e18; --bad-bg: #3d2220; --info-bg: #1f2c3a;
  --mark: #5c4c17; --mark-fg: #f6ecc8; --add: #1f4030; --del: #4a2522; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #131917; --panel: #1b2321; --fg: #e3ebe8; --muted: #93a39e; --line: #2c3835; --sunk: #161d1b;
  --accent: #5fbfa6; --accent-fg: #0d1513; --accent-soft: #1f3a32;
  --ok: #6fcf94; --near: #e3a94a; --bad: #ef7d72; --info: #8fb2d8;
  --ok-bg: #1d3327; --near-bg: #3a2e18; --bad-bg: #3d2220; --info-bg: #1f2c3a;
  --mark: #5c4c17; --mark-fg: #f6ecc8; --add: #1f4030; --del: #4a2522; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
p { margin: 0; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 8px 4px; }
h1 { font: 500 15px var(--display); letter-spacing: .08em; margin: 0; white-space: nowrap; color: var(--muted); }
nav { display: flex; gap: 4px; flex: 1; min-width: 0; }
nav button { font: 500 15px var(--body); border: 0; background: none; color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-fg); }
#dbstate { font-size: 12px; color: var(--muted); white-space: nowrap; }
.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 8px; }
.strip::-webkit-scrollbar { display: none; }
.pick { display: inline-flex; align-items: center; gap: 7px; flex: none; font: 500 15px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 6px; cursor: pointer; }
.pick[aria-pressed="true"] { border-color: var(--fg); background: var(--panel); box-shadow: inset 0 0 0 1px var(--fg); }
.dot { width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); flex: none; }
.badge { font: 500 11px/1 var(--mono); padding: 3px 5px; border-radius: 999px; background: var(--near-bg); color: var(--near); }
.badge.draft { background: var(--info-bg); color: var(--info); }

main { display: grid; gap: 14px; padding-block: 14px 72px; }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h2 { font: 700 20px/1.2 var(--display); margin: 0; letter-spacing: .02em; text-wrap: balance; }
h3 { font: 500 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }

.hero { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.hero .swatch { grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.hero h2 { font-size: 26px; }
.ctx { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
select, textarea, input[type="text"], input[type="number"] { font: 15px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; box-sizing: border-box; min-width: 0; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
textarea.changed, input.changed { border-color: var(--info); box-shadow: 0 0 0 1px var(--info); }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn { font: 700 14px var(--body); background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
.btn.ghost.on { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.btn.danger { background: none; color: var(--bad); border: 1px solid var(--line); font-weight: 500; }
.btn.small { font-size: 13px; padding: 4px 9px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--sunk); border-radius: 9px; padding: 3px; }
.seg button { font: 500 14px var(--body); border: 0; background: none; color: var(--muted); padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Sorted appearance: a label column and the sentences, as written. */
dl.sorted { margin: 0; display: grid; grid-template-columns: minmax(96px, 150px) 1fr; border-top: 1px solid var(--line); }
dl.sorted > div { display: contents; }
dl.sorted dt, dl.sorted dd { padding: 8px 0; border-bottom: 1px solid var(--line); }
dl.sorted dt { font: 500 12px var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding-right: 12px; padding-top: 11px; }
dl.sorted dd { margin: 0; display: grid; gap: 6px; min-width: 0; }
.sent { display: block; }
.tag { display: inline-block; font: 500 11px/1.3 var(--mono); color: var(--muted); background: var(--sunk); border-radius: 5px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.tag.src { color: var(--info); background: var(--info-bg); }
@media (max-width: 520px) {
  dl.sorted { grid-template-columns: 1fr; }
  dl.sorted dt { border-bottom: 0; padding-bottom: 0; }
}
.raw { display: grid; gap: 8px; }
.raw p { padding: 8px 10px; background: var(--bg); border-radius: 8px; }
.sub { display: grid; gap: 8px; padding-top: 4px; }

.editor { display: grid; gap: 10px; padding: 12px; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.path { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }

/* What the AI reads. */
.sent-rows { display: grid; gap: 10px; }
.sent-row { display: grid; gap: 4px; min-width: 0; }
.key { font: 500 13px var(--mono); color: var(--accent); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.quote { font: 13.5px/1.55 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.absent { font-size: 14px; color: var(--muted); padding: 8px 10px; border-radius: 8px; background: var(--sunk); }
.guide { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; font-size: 14px; color: var(--muted); }
details.fold { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
details.fold > summary { padding: 8px 10px; cursor: pointer; font-size: 14px; color: var(--muted); }
details.fold pre { margin: 0; padding: 0 10px 10px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 60vh; overflow-y: auto; }
mark { background: var(--mark); color: var(--mark-fg); border-radius: 3px; }
.meter { display: flex; gap: 14px; flex-wrap: wrap; font: 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Photo. */
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.slots .wide { grid-column: 1 / -1; }
@media (max-width: 560px) { .slots { grid-template-columns: 1fr; } }
.slots input[type="text"] { width: 100%; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.prompt-out { font: 14px/1.6 var(--mono); background: var(--sunk); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-block; font: 500 12px/1.2 var(--mono); padding: 3px 7px; border-radius: 999px; }
.chip.near { background: var(--near-bg); color: var(--near); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }

/* Draft bar and diffs. */
.draftbar { position: sticky; bottom: 0; z-index: 4; background: var(--info-bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.draftbar .wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 8px; }
.draftbar .grow { flex: 1; min-width: 160px; font-size: 14px; }
.diff { font: 13px/1.6 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.diff ins { background: var(--add); text-decoration: none; border-radius: 3px; }
.diff del { background: var(--del); border-radius: 3px; }

/* Notes. */
.notes { display: grid; gap: 8px; }
.note { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; background: var(--bg); min-width: 0; }
.note.done { opacity: .6; }
.note .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.note .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.err { color: var(--bad); }
.status { font-size: 13px; color: var(--muted); }

/* Lineup. */
.lineup { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.lineup .card { cursor: pointer; text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.lineup .card:hover { border-color: var(--muted); }
.lineup dl { margin: 0; display: grid; gap: 6px; font-size: 14px; }
.lineup dt { font: 500 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lineup dd { margin: 0; }
@media (prefers-reduced-motion: no-preference) { .pick, .btn, .seg button { transition: background-color .15s, border-color .15s; } }
</style>

<header class="top">
  <div class="wrap bar">
    <h1>Dressing Room</h1>
    <nav id="tabs" aria-label="Views"></nav>
    <span id="dbstate"></span>
  </div>
  <div class="wrap strip" id="strip" role="toolbar" aria-label="Companions"></div>
</header>
<main class="wrap" id="main"><p class="muted">Loading the roster…</p></main>
<div id="draftbar"></div>
<script type="module" src="bench/dressing.js"></script>
